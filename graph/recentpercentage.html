  const visibility = rawSeries.map(() => true);
  const totalLen = Math.max(...rawSeries.map(s => s.values.length), 1);
  const startEl = document.getElementById('viewRangeStart');
  const endEl = document.getElementById('viewRangeEnd');
  const resetEl = document.getElementById('viewRangeReset');
  const togglesEl = document.getElementById('viewSeriesToggles');

  if (rawSeries.length > 1) {
    togglesEl.innerHTML = rawSeries.map((s, idx) =>
      '<label style="display:inline-flex;align-items:center;gap:6px;padding:4px 10px;background:#fff;border:1px solid #cbd5e1;border-radius:9999px;font-size:12px;font-weight:bold;color:#334155;cursor:pointer;user-select:none;">' +
        '<input type="checkbox" data-idx="' + idx + '" checked style="accent-color:' + s.color + ';cursor:pointer;">' +
        '<span style="width:10px;height:10px;border-radius:9999px;background:' + s.color + ';display:inline-block;"></span>' +
        '<span>' + s.name + '</span>' +
      '</label>'
    ).join('');
  } else {
    togglesEl.style.display = 'none';
  }

  function buildPercentageData() {
    let s = parseInt(startEl.value, 10);
    let e = parseInt(endEl.value, 10);
    s = (!isNaN(s) && s >= 1) ? Math.min(s, totalLen) : 1;
    e = (!isNaN(e) && e >= 1) ? Math.min(e, totalLen) : totalLen;
    if (e < s) e = s;
    const count = e - s + 1;
    const labels = Array.from({ length: count }, (_, i) => String(s + i));
    const visibleItems = rawSeries
      .map((item, idx) => ({ item, idx }))
      .filter(({ idx }) => visibility[idx])
      .map(({ item }) => {
        const slice = [];
        for (let i = s - 1; i < e; i++) {
          slice.push(item.values[i] !== undefined ? item.values[i] : 0);
        }
        return { ...item, rawValues: slice };
      });

    const totals = Array.from({ length: count }, (_, idx) =>
      visibleItems.reduce((sum, item) => sum + item.rawValues[idx], 0)
    );

    const datasets = visibleItems.map(item => ({
      label: item.name,
      data: item.rawValues.map((v, idx) => totals[idx] > 0 ? Number(((v / totals[idx]) * 100).toFixed(2)) : 0),
      rawValues: item.rawValues,
      borderColor: item.color,
      backgroundColor: item.color + 'cc',
      borderWidth: 1.5,
      pointBackgroundColor: '#ffffff',
      pointBorderColor: item.color,
      pointBorderWidth: 0,
      pointRadius: 0,
      pointHoverRadius: 5,
      fill: 'stack',
      tension: 0.35
    }));

    return { labels, datasets };
  }

  const chart = new Chart(document.getElementById('myPercentageChart'), {
    type: 'line',
    data: buildPercentageData(),
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      scales: {
        x: { stacked: true },
        y: {
          stacked: true,
          min: 0,
          max: 100,
          ticks: { callback: function(v) { return v + '%'; } }
        }
      },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: function(ctx) {
              const raw = ctx.dataset.rawValues ? ctx.dataset.rawValues[ctx.dataIndex] : '';

            }
          }
        }
      }
    }
  });

  function updateView() {
    const next = buildPercentageData();
    chart.data.labels = next.labels;
    chart.data.datasets = next.datasets;
    chart.update();
  }

  togglesEl.addEventListener('change', (e) => {
    if (e.target && e.target.dataset.idx !== undefined) {
      const idx = parseInt(e.target.dataset.idx, 10);
      visibility[idx] = e.target.checked;
      e.target.parentElement.style.opacity = e.target.checked ? '1' : '0.45';
      updateView();
    }
  });

  startEl.addEventListener('input', updateView);
  endEl.addEventListener('input', updateView);
  resetEl.addEventListener('click', () => {
    startEl.value = '';
    endEl.value = '';
    updateView();
  });
  const yMinEl = document.getElementById('viewYMin');
  const yMaxEl = document.getElementById('viewYMax');
  const yResetEl = document.getElementById('viewYReset');

  function updateYBounds() {
    const minRaw = yMinEl.value.trim();
    const maxRaw = yMaxEl.value.trim();
    const defMin = 0;
    const defMax = 100;
    const minVal = (minRaw !== '' && !isNaN(parseFloat(minRaw))) ? parseFloat(minRaw) : defMin;
    const maxVal = (maxRaw !== '' && !isNaN(parseFloat(maxRaw))) ? parseFloat(maxRaw) : defMax;
    chart.options.scales.y.min = minVal;
    chart.options.scales.y.max = maxVal;
    
    chart.update();
  }

  yMinEl.addEventListener('input', updateYBounds);
  yMaxEl.addEventListener('input', updateYBounds);
  yResetEl.addEventListener('click', () => {
    yMinEl.value = '';
    yMaxEl.value = '';
    updateYBounds();
  });
})();
