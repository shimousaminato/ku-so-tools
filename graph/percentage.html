    chart.update();
  }

  yMinEl.addEventListener('input', updateYBounds);
  yMaxEl.addEventListener('input', updateYBounds);
  yResetEl.addEventListener('click', () => {
    yMinEl.value = '';
    yMaxEl.value = '';
    updateYBounds();
  });
})();
</script>
