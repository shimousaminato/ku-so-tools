    const minRaw = yMinEl.value.trim();
    const maxRaw = yMaxEl.value.trim();
    const minVal = (minRaw !== '' && !isNaN(parseFloat(minRaw))) ? parseFloat(minRaw) : undefined;
    const maxVal = (maxRaw !== '' && !isNaN(parseFloat(maxRaw))) ? parseFloat(maxRaw) : undefined;
    chart.options.scales.y.min = minVal;
    chart.options.scales.y.max = maxVal;
    chart.options.scales.y.beginAtZero = (minVal === undefined);
    chart.update();
  }

  yMinEl.addEventListener('input', updateYBounds);
  yMaxEl.addEventListener('input', updateYBounds);
  yResetEl.addEventListener('click', () => {
    yMinEl.value = '';
    yMaxEl.value = '';
    updateYBounds();
  });
})();
</script>
